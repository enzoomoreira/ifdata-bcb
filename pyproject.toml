[project]
name = "ifdata-bcb"
version = "0.5.0"
description = "Analise de dados financeiros do Banco Central do Brasil (BCB)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=10.0.0",
    "httpx>=0.28.0",
    "platformdirs>=3.0.0",
    "thefuzz[speedup]>=0.22.0",
    "duckdb>=1.5.0",
    "loguru>=0.7.3",
    "rich>=14.3.1",
    "tenacity>=9.1.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
]

[project.urls]
Homepage = "https://github.com/enzoomoreira/ifdata-bcb"
Repository = "https://github.com/enzoomoreira/ifdata-bcb"
Documentation = "https://github.com/enzoomoreira/ifdata-bcb/tree/master/docs"
"Bug Tracker" = "https://github.com/enzoomoreira/ifdata-bcb/issues"
Changelog = "https://github.com/enzoomoreira/ifdata-bcb/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ifdata_bcb"]

[dependency-groups]
dev = [
    "ipykernel==6.29.5",
    "openpyxl>=3.1.5",
    "pytest>=9.0.2",
    # Pin exato: o rule set default do ruff muda entre minors, e um `uvx ruff`
    # sem versao quebra o CI sozinho. Subir a versao e um PR deliberado.
    "ruff==0.16.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["temp"]

[tool.ruff.lint]
select = [
    "E4",   # pycodestyle: imports
    "E7",   # pycodestyle: statements
    "E9",   # pycodestyle: erros de runtime/sintaxe
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "SIM",  # flake8-simplify
    "RUF",  # regras especificas do ruff
]
ignore = [
    # __all__ e agrupado por dominio, com comentario por bloco; ordenar
    # alfabeticamente destruiria o agrupamento sem ganho nenhum.
    "RUF022",
]

[tool.ruff.lint.isort]
# Explicito em vez de depender da deteccao do layout src/: sem isso, uma
# mudanca na heuristica do ruff faria o proprio pacote virar third-party e
# brigar com a ordenacao que o formatter aplica.
known-first-party = ["ifdata_bcb"]

[tool.ruff.lint.per-file-ignores]
# Explorers fake espelham os class attributes dos reais; ClassVar so ruido aqui.
"tests/**" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "temp"]
addopts = "-p no:cacheprovider -m 'not contract'"
markers = [
    "contract: testes que fazem requisicoes reais ao BCB (rodar sob demanda)",
]
